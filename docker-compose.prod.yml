services:
  database:
    image: postgres:16-alpine
    container_name: midnight_directus_db
    restart: unless-stopped
    networks:
      - midnight_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  directus:
    image: directus/directus:11
    container_name: midnight_directus
    restart: unless-stopped
    networks:
      - midnight_internal
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - /opt/midnight-be/directus/uploads:/directus/uploads
      - /opt/midnight-be/directus/extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}

      WEBSOCKETS_ENABLED: "true"

      IP_TRUST_PROXY: "loopback,linklocal,uniquelocal"

      LOG_LEVEL: info

      NODE_OPTIONS: "--max-old-space-size=512"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mood-mapper:
    image: node:20-alpine
    container_name: midnight_mood_mapper
    restart: unless-stopped
    networks:
      - midnight_internal
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./functions:/app:ro
    working_dir: /app
    command: ["node", "mood-mapper.js"]
    environment:
      MOOD_MAPPER_PORT: "3001"
      DIRECTUS_BASE: "http://directus:8055"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      directus:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  midnight_internal:
    driver: bridge

volumes:
  postgres_data:
    name: midnight_postgres_data
